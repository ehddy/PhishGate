design_translation:
  retained_patterns:
    - browser-native JavaScript alert shown before protected content
    - one explicit acknowledgement click
    - sparse neutral page behind the alert
  local_adaptations:
    - annotation-derived brand label with neutral protected-content language
    - responsive local-only loading page
    - no copied brand logos or external assets
excluded_behaviors:
  - credential or email collection
  - native notification permission request
  - CAPTCHA
  - external scripts, analytics, and form actions

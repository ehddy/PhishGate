design_translation:
  retained_patterns:
    - pale blue full-page document preparation context
    - centered white status card with a document icon
    - completed progress bar followed by one explicit Continue action
    - short ready-state confirmation before navigation
  local_adaptations:
    - annotation-derived service label with a neutral document-service fallback
    - static completed progress state instead of time-based behavior
    - responsive local HTML and CSS with no copied logo or screenshot asset
    - completion returns to the isolated upstream path instead of opening a file
excluded_behaviors:
  - timed delays, randomization, downloads, or file generation
  - credential, email, or submitted-value collection
  - upstream kit content in the initial Gate response
  - external scripts, analytics, tracking, and form actions

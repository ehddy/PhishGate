    observed_pattern: top notification request paired with a large spatial instruction to choose Allow
design_translation:
  retained_patterns:
    - dark security-check page with short numbered instructions
    - prominent notification-access card containing Block and Allow choices
    - page instructions positioned below the access request to direct attention upward
    - explicit automation-protection and secure-session context
  local_adaptations:
    - the permission card is ordinary page content rather than native browser chrome
    - annotation-derived brand name with a neutral fallback
    - original SVG line icons and local responsive CSS with no copied artwork or logos
    - Block displays a local retry explanation while Allow completes the gate
runtime_behavior:
  allow:
    effect: invoke the existing Click completion handler once
    destination: return to the opaque token's original kit path
  block:
    effect: keep the gate locked and display a retry message
  refresh:
    effect: retain the server-side pending gate for the current token and session
excluded_behaviors:
  - Notification.requestPermission or any real browser permission change
  - push subscription, service worker registration, or notification delivery
  - credential, payment, email, personal-data, or form-value collection
  - fingerprinting, analytics, tracking, or external network requests
  - ClickFix instructions, clipboard use, command execution, and copied third-party assets

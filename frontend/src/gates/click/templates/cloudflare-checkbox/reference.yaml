design_translation:
  retained_patterns:
    - sparse white interstitial with a short connection-security heading
    - compact light-gray human-verification checkbox widget
    - orange cloud provider mark with privacy and help labels
    - subdued automatic-redirect copy and connection footer
  local_adaptations:
    - annotation-derived site label with a neutral fallback
    - CSS-only provider mark and responsive local-only layout

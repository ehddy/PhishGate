design_translation:
  retained_patterns:
    - a familiar document viewer provides the reason to scroll
    - multiple document pages keep the gated state below the initial viewport
    - a single measurable scroll threshold changes the state
  local_adaptations:
    - generic PDF toolbar and synthetic three-page document use local HTML and CSS
    - current-page feedback replaces the conspicuous research progress bar
    - annotation-derived service name uses a neutral document-service fallback
    - completion opens the isolated upstream instead of a download or update lure
excluded_behaviors:
  - executable, plugin, or browser-update downloads
  - fake browser chrome or address-bar impersonation
  - credential, password, or submitted-value collection
  - upstream kit content in the initial Gate response
  - external scripts, analytics, tracking, and form actions

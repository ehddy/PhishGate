schema_version: 1
template:
  id: below-fold-reveal
  gate_type: interaction
  version: 0.2.0
  completion_condition: reach-scroll-threshold
  parameters:
    threshold_percent: 82
references:
  - publisher: SANS Internet Storm Center
    title: Nice Phishing Sample Delivering Trickbot
    url: https://isc.sans.edu/diary/23641
    locator: window.onscroll handler that reveals content only after scrolling
    research_scope: content revealed only after the visitor scrolls the page
  - publisher: IEEE/IFIP DSN 2025 (Boulila et al.)
    title: A Closer Look At Modern Evasive Phishing Emails
    url: https://doi.org/10.1109/DSN64029.2025.00066
    locator: client-side user-interaction cloaking discussion
    research_scope: scrolling classified as a content-reveal interaction
design_translation:
  retained_patterns:
    - a familiar mail-reading layout provides a natural reason to scroll
    - a routine delivery failure notice fills the initial viewport
    - additional message content is positioned below the fold
    - a single measurable scroll threshold changes the state
  local_adaptations:
    - generic responsive webmail chrome replaces the source service interface
    - all sender, recipient, reference, and message text is synthetic
    - the revealed card contains no active link and completion opens the isolated upstream
    - local HTML and CSS replace screenshots, logos, and third-party assets
excluded_behaviors:
  - external links, redirects, scripts, analytics, tracking, and form actions
  - credential, email, or submitted-value collection
  - exact third-party branding or browser-chrome impersonation
  - upstream kit content in the initial Gate response

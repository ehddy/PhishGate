; Shared by Docker and Conda PHP runtimes. Keep delivery, outbound sockets,
; command execution, and uploads unavailable without disabling ordinary local
; file helpers that many archived kits use while advancing between screens.
;
; mail() remains defined so a legacy handler does not fatal on PHP 8, but its
; sendmail process is an inert success sink and never delivers a message.
disable_functions=curl_exec,curl_multi_exec,error_log,exec,fsockopen,imap_mail,mb_send_mail,move_uploaded_file,passthru,pcntl_exec,pfsockopen,popen,proc_open,putenv,shell_exec,socket_connect,socket_create,socket_send,socket_sendto,socket_write,stream_socket_client,stream_socket_server,system
sendmail_path=/bin/true
allow_url_fopen=Off
allow_url_include=Off

; Keep defanged kit runtime failures out of rendered experiment pages and logs.
display_errors=Off
display_startup_errors=Off
log_errors=Off
max_execution_time=20

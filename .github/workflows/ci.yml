name: PhishGate CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phishgate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.0"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install backend dependencies
        run: pip install --require-hashes --requirement backend/requirements.lock.txt

      - name: Run backend tests
        env:
          PYTHONPATH: backend:.
        run: python -m unittest discover -s backend/tests -p "test_*.py"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Assert preview seam is absent from production build
        # The DEV-only screenshot preview seam (src/gates/preview/) must be
        # tree-shaken out of every production build. Fail if any of its markers
        # survive in dist/, which would mean the token-free gate-config path
        # leaked into the shipped bundle.
        run: |
          if grep -rl "PHISHGATE_PREVIEW_CONFIG\|buildPreviewConfig" dist; then
            echo "ERROR: preview seam leaked into production build (dist/)." >&2
            exit 1
          fi
          echo "OK: no preview seam in dist/."

  compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate Docker Compose
        env:
          PHISHGATE_SEED: ci-config
        run: docker compose --profile demo config --quiet

  demo-smoke:
    name: Demo smoke test
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build
      - compose-config
    timeout-minutes: 15
    env:
      PHISHGATE_SEED: ci-demo
      PHISHGATE_HOST: 127.0.0.1
      PHISHGATE_PORT: 8080
      PHISHGATE_DOMAIN_STYLE: "off"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build and start demo
        run: docker compose --profile demo up --build --detach --wait --wait-timeout 180

      - name: Check HTTP response
        run: curl --fail --show-error --retry 10 --retry-delay 2 http://127.0.0.1:8080/

      - name: Show container logs on failure
        if: failure()
        run: docker compose --profile demo logs --no-color

      - name: Stop demo
        if: always()
        run: docker compose --profile demo down --volumes
